<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บันทึกรายรับรายจ่าย</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>บันทึกรายรับรายจ่าย</h1>

        <!-- Form for adding income and expense -->
        <form id="transaction-form">
            <label for="transaction-type">ประเภท</label>
            <select id="transaction-type" required>
                <option value="income">รายรับ</option>
                <option value="expense">รายจ่าย</option>
            </select>

            <label for="amount">จำนวนเงิน</label>
            <input type="number" id="amount" placeholder="ระบุจำนวนเงิน" required>

            <label for="description">รายละเอียด</label>
            <input type="text" id="description" placeholder="ระบุรายละเอียด" required>

            <button type="submit">บันทึก</button>
        </form>

        <!-- List of transactions -->
        <h2>รายการบันทึก</h2>
        <table id="transaction-list">
            <thead>
                <tr>
                    <th>ประเภท</th>
                    <th>จำนวนเงิน</th>
                    <th>รายละเอียด</th>
                    <th>วันที่</th>
                </tr>
            </thead>
            <tbody>
                <!-- รายการจะถูกเพิ่มที่นี่ -->
            </tbody>
        </table>

        <div id="summary">
            <h3>ยอดรวม</h3>
            <p>รายรับ: <span id="total-income">0</span> บาท</p>
            <p>รายจ่าย: <span id="total-expense">0</span> บาท</p>
            <p>ยอดรวมสุทธิ: <span id="net-total">0</span> บาท</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
